version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: prompt_management_db
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: prompt_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    env_file:
      - .env

volumes:
  postgres_data: