# Production stack: API + Postgres + Redis + RabbitMQ
# Usage:
#   cp .env.prod.example .env.prod   # fill secrets
#   docker compose -f docker-compose.prod.yaml --env-file .env.prod up -d --build

name: how2prompt-prod

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: how2prompt-api:${IMAGE_TAG:-latest}
    container_name: how2prompt-api-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      # Database
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # JWT (PEM with \n for newlines, or mount secrets)
      JWT_PRIVATE_KEY_PEM: ${JWT_PRIVATE_KEY_PEM:-}
      JWT_PUBLIC_KEY_PEM: ${JWT_PUBLIC_KEY_PEM:-}
      # Auth / CORS
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_CORS_ORIGINS: ${AUTH_CORS_ORIGINS}
      # Mail
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@how2prompt.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-How2Prompt}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      EMAIL_VERIFY_TTL: ${EMAIL_VERIFY_TTL:-24h}
      EMAIL_RESEND_COOLDOWN: ${EMAIL_RESEND_COOLDOWN:-60s}
      # JVM
      JAVA_OPTS: ${JAVA_OPTS:--XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Dspring.jpa.show-sql=false}
    networks:
      - how2prompt
    healthcheck:
      # /v3/api-docs is public (SecurityConfig). Actuator optional if added later.
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8080/v3/api-docs >/dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  postgres:
    image: postgres:16-alpine
    container_name: how2prompt-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    # Not published by default — only reachable on internal network
    expose:
      - "5432"
    networks:
      - how2prompt
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:8.8-alpine
    container_name: how2prompt-redis-prod
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD}",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    volumes:
      - redis_data_prod:/data
    expose:
      - "6379"
    networks:
      - how2prompt
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    container_name: how2prompt-rabbitmq-prod
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data_prod:/var/lib/rabbitmq
    expose:
      - "5672"
      - "15672"
    networks:
      - how2prompt
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  how2prompt:
    driver: bridge

volumes:
  postgres_data_prod:
  redis_data_prod:
  rabbitmq_data_prod:
