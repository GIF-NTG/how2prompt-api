name: CI/CD Pipeline cho API

# Pipeline sẽ chạy mỗi khi bạn push code lên nhánh main
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Tải source code về máy ảo của GitHub
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Đăng nhập vào Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Build và Push Image lên Docker Hub
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/how2prompt-api:latest

      # 4. SSH vào EC2 và ra lệnh Deploy
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # Đây là các lệnh sẽ chạy ngầm trên EC2 của bạn
          script: |
            cd /home/ec2-user/how2prompt-api
            sudo docker compose -f docker-compose.prod.yaml pull api
            sudo docker compose -f docker-compose.prod.yaml up -d api
            # (Tùy chọn) Xóa các image cũ để giải phóng ổ cứng EC2
            sudo docker image prune -f