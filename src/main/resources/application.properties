spring.config.import=optional:file:.env[.properties]

spring.application.name=how2prompt

spring.datasource.url=jdbc:postgresql://localhost:5432/prompt_db
spring.datasource.username=dev_user
spring.datasource.password=dev_password
spring.datasource.driver-class-name=org.postgresql.Driver

# MUST be set to validate or none when using Flyway. 
# Never use update or create in combination with Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
# Helpful if integrating into an existing database
spring.flyway.baseline-on-migrate=true