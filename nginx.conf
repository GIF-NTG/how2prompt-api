upstream how2prompt_app {
    server api:8080;
}

server {
    listen 80;
    server_name how2prompt.threddit.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name how2prompt.threddit.site;

    ssl_certificate     /etc/letsencrypt/live/how2prompt.threddit.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/how2prompt.threddit.site/privkey.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://how2prompt_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
